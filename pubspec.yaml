publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  intl: ^0.20.3
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
