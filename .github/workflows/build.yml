name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Create Android host project
        run: |
          flutter create \
            --platforms=android \
            --org com.offlineschoolmanager \
            --project-name offline_school_manager \
            .

      - name: Configure Android notifications/desugaring
        shell: python
        run: |
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()

          # flutter_local_notifications 21+ requires core library desugaring.
          if "isCoreLibraryDesugaringEnabled" not in text:
              text = text.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )

          if "coreLibraryDesugaring(" not in text:
              marker = "dependencies {"
              dependency = (
                  'dependencies {\n'
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              )
              if marker in text:
                  text = text.replace(marker, dependency, 1)
              else:
                  text += (
                      '\n\ndependencies {\n'
                      '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                      '}\n'
                  )

          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()

          if 'android.permission.POST_NOTIFICATIONS' not in m:
              m = m.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
                  1,
              )

          receiver = '''
            <receiver
                android:exported="false"
                android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
            <receiver
                android:exported="false"
                android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                <intent-filter>
                    <action android:name="android.intent.action.BOOT_COMPLETED"/>
                    <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                    <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                    <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                </intent-filter>
            </receiver>
            <receiver
                android:exported="false"
                android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver" />
          '''

          if "ScheduledNotificationReceiver" not in m:
              m = m.replace("</application>", receiver + "\n    </application>", 1)

          manifest.write_text(m)

      - name: fix error 
        run: dart fix --apply

      - name: Verify dependencies
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-school-manager-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
